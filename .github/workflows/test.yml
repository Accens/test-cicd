name: CI
 
on:
  push:
    branches:
      - main
      - piotr_bartkowski
      - PB
  pull_request:
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3
 
      # 2. Set up Node.js
      - name: Setup cache for Node.js modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.yarn/cache
            node_modules  
          key: node-cache-Linux-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            node-cache-Linux-yarn-
 
      # 3. Install dependencies
      - name: Install dependencies
        run: yarn install --frozen-lockfile
 
      # 4. Run Linter
      - name: Run ESLint
        run: yarn lint
 
      # 5. Build the application
      - name: Build the app
        run: yarn build
      
      # 11. Fail on test errors
      - name: Fail on test errors
        if: failure() # Uruchom tylko, jeśli poprzednie kroki zakończą się błędem
        run: |
          echo "Tests failed. Failing the job."
          exit 1
 
 